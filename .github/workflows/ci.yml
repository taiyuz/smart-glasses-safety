name: CI

on:
  push:
    branches: [main]
  pull_request:

# JVM unit tests for scorer/tracker. assembleDebug is not run here: it needs a
# full Android SDK image and is left to local Android Studio.
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
