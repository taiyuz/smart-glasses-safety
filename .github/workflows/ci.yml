name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # gradle-wrapper.jar is not committed (MCP would corrupt the binary).
      # CI invokes Gradle 8.7 from setup-gradle, not ./gradlew.
      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
