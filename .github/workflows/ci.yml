name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools platforms;android-34 build-tools;34.0.0"

      # gradle-wrapper.jar is a binary and is not committed. Android Studio
      # generates it on first sync. CI provisions Gradle 8.7 directly.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Unit tests only. assembleDebug is not run here: it needs a full local
      # Android Studio / SDK workflow (signing, extra images) beyond this job.
      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
