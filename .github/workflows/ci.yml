name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # gradle-wrapper.jar is not committed (MCP/binary-safe). CI therefore
      # invokes the Gradle 8.7 distribution from setup-gradle, not ./gradlew.
      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      # assembleDebug is not run here: it needs a fuller SDK/build-tools image
      # than this job installs. Build the APK from Android Studio locally.
